server {
    server_name cerybro.cairakuzey.cloud;

    root /opt/ai-ceo/app/frontend;
    index index.html;

    location = /manifest.webmanifest {
        default_type application/manifest+json;
        types { }
    }

    location = /health {
        proxy_pass http://127.0.0.1:3110/health;
    }

    location = /ready {
        proxy_pass http://127.0.0.1:3110/ready;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:3110;
    }

    location ~ ^/(docs|openapi.json)(/|$) {
        proxy_pass http://127.0.0.1:3110;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/cerybro.cairakuzey.cloud/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/cerybro.cairakuzey.cloud/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}
server {
    if ($host = cerybro.cairakuzey.cloud) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name cerybro.cairakuzey.cloud;
    return 404; # managed by Certbot


}