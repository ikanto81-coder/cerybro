name: cerybro

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: cerybro-postgres
    restart: unless-stopped
    env_file:
      - /opt/ai-ceo/config/.env
    environment:
      POSTGRES_USER: cerybro
      POSTGRES_DB: cerybro
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /opt/ai-ceo/data/postgres:/var/lib/postgresql/data
    networks:
      - cerybro-internal
    shm_size: 256mb
    mem_limit: 1200m
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cerybro -d cerybro"]
      interval: 15s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: cerybro-redis
    restart: unless-stopped
    env_file:
      - /opt/ai-ceo/config/.env
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$$REDIS_PASSWORD\""]
    volumes:
      - /opt/ai-ceo/data/redis:/data
    networks:
      - cerybro-internal
    mem_limit: 256m
    cpus: 0.5
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping | grep -q PONG"]
      interval: 15s
      timeout: 5s
      retries: 5

  api:
    env_file:
      - ./config/.env
    build:
      context: ./app/backend
    container_name: cerybro-api
    volumes:
      - /opt/ai-ceo/data/uploads:/data/uploads
      - /opt/ai-ceo/backups/deleted-agents:/data/deleted-agents
      - /opt/ai-ceo/backups/agents:/data/agent-backups
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://cerybro:${POSTGRES_PASSWORD}@postgres:5432/cerybro
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379/0
    ports:
      - "127.0.0.1:3110:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cerybro-internal
      - cerybro-public
    mem_limit: 700m
    cpus: 0.7
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 20s

networks:
  cerybro-internal:
    external: true
  cerybro-public:
    driver: bridge
 
